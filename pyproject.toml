[project]
name = "slider"
version = "2.3.0"
description = "Atelier decks PPTX et datapacks Excel à la charte client"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0", "Pillow>=10", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
